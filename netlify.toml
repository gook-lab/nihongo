# Netlify 배포 설정
#
# 옵션 B (Git 없이 CLI/드래그앤드롭) 사용 시에도 이 파일이 같이 업로드되면
# Netlify가 자동으로 적용합니다.
# Git 연동 시: build 명령으로 자동 빌드 + redirects/headers/env 그대로 적용.

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — React Router로 직접 URL 진입 시에도 index.html 서빙
# (public/_redirects 보다 우선)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── 보안/캐시 헤더 ───────────────────────────────────────────
# Netlify는 정적 파일 캐시를 자동으로 잘 처리하지만, 보안 헤더는 명시 필요.

[[headers]]
  for = "/*"
  [headers.values]
    # 보안
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # 콘텐츠 보안 정책 (CSP)
    # - script: self + Firebase (auth) + Google Identity (OIDC)
    # - connect: Firebase, Google APIs, Gemini, Murf, GlitchTip, KanjiVG CDN
    # - img: self + data URI (Lottie 등) + Google profile pics
    # - font: Google Fonts
    # - frame: Google Sign-In iframe
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://accounts.google.com https://*.firebaseapp.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://generativelanguage.googleapis.com https://api.murf.ai https://app.glitchtip.com https://cdn.jsdelivr.net wss://*.firebaseio.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src https://*.firebaseapp.com https://accounts.google.com; media-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"

# JS / CSS / Lottie / 폰트 — 해시 기반 파일명이라 영구 캐시 가능
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker — 새 버전 즉시 전파되도록 캐시 안 함
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Manifest / icons
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
