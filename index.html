    <!-- 외부 도메인 dns-prefetch — preconnect는 즉시 사용 도메인에만.
         Firebase 도메인은 로그인 시점에 dynamic import로 연결되므로 dns-prefetch만. -->
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://securetoken.googleapis.com" />
    <link rel="dns-prefetch" href="https://generativelanguage.googleapis.com" />
    <link rel="dns-prefetch" href="https://api.murf.ai" />
    <link rel="dns-prefetch" href="https://app.glitchtip.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://plausible.io" />

    <!-- Plausible Analytics — 프라이버시 친화 분석 (쿠키 없음, GDPR 자동 준수)
         data-domain은 실제 Plausible 계정 등록 후 도메인으로 교체.
         로컬/지원 안 되면 스크립트만 무시됨. -->
    <script
      defer
      data-domain="nihan-go-test.netlify.app"
      src="https://plausible.io/js/script.js"
    ></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          ;(window.plausible.q = window.plausible.q || []).push(arguments)
        }
    </script>

    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="canonical" href="https://nihan-go-test.netlify.app/" />
    <title>니혼고 앱 — 일본어 학습</title>
    <!-- LCP 핵심: 인라인 스플래시 — JS 파싱 전에 즉시 페인트. React mount 시 자동 교체.
         (SplashPage.tsx의 시각적 카피와 동일하게 유지)
         LCP 보호: 메인 텍스트 "ことば"는 opacity 1로 시작 — scale entrance만 적용. -->
    <style>
      .boot-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        color: #fff; overflow: hidden;
        background: linear-gradient(160deg, #FF5A5F 0%, #FF8FB1 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
        z-index: 0;
      }
      .boot-splash__bubble {
        position: absolute;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.12);
        animation: bootFloat 6s ease-in-out infinite;
        will-change: transform;
      }
      .boot-splash__main {
        font-size: 56px; font-weight: 800; letter-spacing: -2px;
        font-family: "Hiragino Sans", "Noto Sans JP", "Zen Maru Gothic", serif;
        animation: bootSplashIn 0.9s cubic-bezier(.2,.7,.2,1.05);
        will-change: transform;
        position: relative; z-index: 1;
      }
      .boot-splash__sub {
        margin-top: 12px; font-size: 15px; opacity: 0; letter-spacing: 6px;
        animation: bootFadeUp 0.6s 0.3s forwards ease-out;
        position: relative; z-index: 1;
      }
      .boot-splash__brand {
        margin-top: 8px; font-size: 12px; opacity: 0; letter-spacing: 2px;
        animation: bootFadeUp 0.6s 0.55s forwards ease-out;
        position: relative; z-index: 1;
      }
      /* LCP 친화: opacity는 1 유지, scale만 이동 — 첫 페인트에 텍스트 보임. */
      @keyframes bootSplashIn {
        0%   { transform: scale(0.85); }
        55%  { transform: scale(1.04); }
        100% { transform: scale(1); }
      }
      @keyframes bootFadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 0.85; transform: translateY(0); }
      }
      @keyframes bootFloat {
        0%, 100% { transform: translate(0,0) scale(1); opacity: 0.35; }
        50%      { transform: translate(18px, -28px) scale(1.12); opacity: 0.5; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__main, .boot-splash__sub, .boot-splash__brand, .boot-splash__bubble {
          animation: none !important;
        }
        .boot-splash__sub, .boot-splash__brand { opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <span class="boot-splash__bubble" style="width:54px;height:54px;left:12%;top:18%;animation-delay:0s"></span>
        <span class="boot-splash__bubble" style="width:68px;height:68px;left:78%;top:22%;animation-delay:-0.8s"></span>
        <span class="boot-splash__bubble" style="width:82px;height:82px;left:24%;top:74%;animation-delay:-1.6s"></span>
        <span class="boot-splash__bubble" style="width:96px;height:96px;left:62%;top:58%;animation-delay:-2.4s"></span>
        <span class="boot-splash__bubble" style="width:110px;height:110px;left:8%;top:48%;animation-delay:-3.2s"></span>
        <span class="boot-splash__bubble" style="width:124px;height:124px;left:70%;top:80%;animation-delay:-4s"></span>
        <div class="boot-splash__main">ことば</div>
        <div class="boot-splash__sub">KOTOBA</div>
        <div class="boot-splash__brand">니혼고 앱</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
