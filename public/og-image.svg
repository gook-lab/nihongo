<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFEDED"/>
      <stop offset="1" stop-color="#FFD7DC"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7377"/>
      <stop offset="1" stop-color="#FF5A5F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF5A5F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 좌상단 작은 한자 장식 -->
  <text x="80" y="120" font-size="44" font-weight="700" font-family="-apple-system, 'Noto Sans JP', sans-serif" fill="#FF5A5F" opacity="0.18">日本語</text>
  <text x="1040" y="560" font-size="44" font-weight="700" font-family="-apple-system, 'Noto Sans JP', sans-serif" fill="#FF5A5F" opacity="0.18">学習</text>

  <!-- 메인 카드 -->
  <g transform="translate(80, 165)" filter="url(#shadow)">
    <!-- 큰 배지 -->
    <rect x="0" y="0" width="280" height="280" rx="64" fill="url(#badge)"/>
    <text x="140" y="206" font-size="180" font-weight="800" font-family="-apple-system, 'Noto Sans JP', sans-serif" text-anchor="middle" fill="#fff">に</text>
  </g>

  <!-- 우측 텍스트 블록 -->
  <g transform="translate(420, 230)">
    <text font-size="64" font-weight="800" font-family="-apple-system, 'Pretendard', 'Noto Sans KR', sans-serif" fill="#1A1A1A" letter-spacing="-2">
      니혼고 앱
    </text>
    <text y="80" font-size="36" font-weight="600" font-family="-apple-system, 'Pretendard', 'Noto Sans KR', sans-serif" fill="#666">
      매일 조금씩 일본어를 배우는
    </text>
    <text y="125" font-size="36" font-weight="600" font-family="-apple-system, 'Pretendard', 'Noto Sans KR', sans-serif" fill="#666">
      귀여운 학습 앱
    </text>

    <!-- 태그 -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="180" height="48" rx="24" fill="#FF5A5F" opacity="0.12"/>
      <text x="90" y="32" font-size="22" font-weight="700" font-family="-apple-system, 'Pretendard', sans-serif" text-anchor="middle" fill="#FF5A5F">N5 · N4 · N3</text>

      <rect x="195" y="0" width="160" height="48" rx="24" fill="#FF5A5F" opacity="0.12"/>
      <text x="275" y="32" font-size="22" font-weight="700" font-family="-apple-system, 'Pretendard', sans-serif" text-anchor="middle" fill="#FF5A5F">AI 튜터</text>

      <rect x="370" y="0" width="160" height="48" rx="24" fill="#FF5A5F" opacity="0.12"/>
      <text x="450" y="32" font-size="22" font-weight="700" font-family="-apple-system, 'Pretendard', sans-serif" text-anchor="middle" fill="#FF5A5F">회화 280+</text>
    </g>
  </g>
</svg>
