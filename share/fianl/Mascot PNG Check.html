<!doctype html>
<html><head><meta charset="utf-8"/><title>Mascot PNGs</title>
<style>
  body { margin: 0; padding: 40px; font-family: -apple-system, system-ui, sans-serif; background: #F1ECEC; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; margin: 0 0 8px; }
  p { color: #6B6B6B; margin: 0 0 32px; font-size: 14px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .swatch { aspect-ratio: 1; border-radius: 22px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .swatch img { width: 84%; height: 84%; object-fit: contain; }
  .label { position: absolute; bottom: 12px; left: 14px; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: #fff; mix-blend-mode: difference; opacity: 0.7; }
  .bg-white { background: #fff; box-shadow: 0 0 0 1px #EEE; }
  .bg-pink { background: linear-gradient(135deg, #FF3366, #FF8FB1); }
  .bg-dark { background: #161628; }
  .bg-yellow { background: linear-gradient(135deg, #FFD400, #FF8A4D); }
  .bg-mint { background: linear-gradient(135deg, #2EBD6B, #7FB8E6); }
  .bg-checker {
    background-image:
      linear-gradient(45deg, #DDD 25%, transparent 25%),
      linear-gradient(-45deg, #DDD 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #DDD 75%),
      linear-gradient(-45deg, transparent 75%, #DDD 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, 10px 0px;
  }
</style>
</head>
<body>
  <h1>마스코트 투명 PNG</h1>
  <p>배경 제거 결과를 여러 배경 위에서 확인. 가장자리가 깔끔하면 OK.</p>

  <div class="row">
    <div class="swatch bg-checker"><img src="assets/kotaro.png" alt=""/><div class="label">CHECKER</div></div>
    <div class="swatch bg-checker"><img src="assets/yuki.png" alt=""/><div class="label">CHECKER</div></div>
    <div class="swatch bg-checker"><img src="assets/sora.png" alt=""/><div class="label">CHECKER</div></div>
  </div>
  <div class="row">
    <div class="swatch bg-pink"><img src="assets/kotaro.png" alt=""/><div class="label">PINK</div></div>
    <div class="swatch bg-dark"><img src="assets/yuki.png" alt=""/><div class="label">DARK</div></div>
    <div class="swatch bg-yellow"><img src="assets/sora.png" alt=""/><div class="label">YELLOW</div></div>
  </div>
  <div class="row">
    <div class="swatch bg-mint"><img src="assets/kotaro.png" alt=""/><div class="label">MINT</div></div>
    <div class="swatch bg-mint"><img src="assets/yuki.png" alt=""/><div class="label">MINT</div></div>
    <div class="swatch bg-mint"><img src="assets/sora.png" alt=""/><div class="label">MINT</div></div>
  </div>
</body>
</html>
